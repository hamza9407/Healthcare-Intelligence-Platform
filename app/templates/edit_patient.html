{% extends "base.html" %}

{% block title %}
Edit {{ patient.PatientName }} | Healthcare Intelligence Platform
{% endblock %}


{% block content %}

<div class="container-fluid">

    <!-- Page Heading -->
    <div class="mb-4">

        <h2 class="fw-bold mb-1">
            Edit Patient
        </h2>

        <p class="text-muted mb-0">
            Update patient personal and contact information.
        </p>

    </div>


    <!-- Edit Form -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 pt-4 px-4">

            <h5 class="fw-bold mb-1">
                {{ patient.PatientName }}
            </h5>

            <p class="text-muted mb-0">
                Patient ID: #{{ patient.PatientID }}
            </p>

        </div>


        <div class="card-body p-4">

            <form method="POST">

                <div class="row g-4">

                    <!-- Patient Name -->
                    <div class="col-md-6">

                        <label for="patient_name" class="form-label">
                            Patient Name *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="patient_name"
                            name="patient_name"
                            value="{{ patient.PatientName }}"
                            required
                        >

                    </div>


                    <!-- CNIC -->
                    <div class="col-md-6">

                        <label for="cnic" class="form-label">
                            CNIC *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cnic"
                            name="cnic"
                            value="{{ patient.CNIC }}"
                            maxlength="15"
                            required
                        >

                    </div>


                    <!-- Gender -->
                    <div class="col-md-6">

                        <label for="gender" class="form-label">
                            Gender *
                        </label>

                        <select
                            class="form-select"
                            id="gender"
                            name="gender"
                            required
                        >

                            <option
                                value="Male"
                                {% if patient.Gender == "Male" %}selected{% endif %}
                            >
                                Male
                            </option>

                            <option
                                value="Female"
                                {% if patient.Gender == "Female" %}selected{% endif %}
                            >
                                Female
                            </option>

                        </select>

                    </div>


                    <!-- Date of Birth -->
                    <div class="col-md-6">

                        <label for="date_of_birth" class="form-label">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="date_of_birth"
                            name="date_of_birth"
                            value="{{ patient.DateOfBirth or '' }}"
                        >

                    </div>


                    <!-- Phone -->
                    <div class="col-md-6">

                        <label for="phone_number" class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="phone_number"
                            name="phone_number"
                            value="{{ patient.PhoneNumber or '' }}"
                        >

                    </div>


                    <!-- Blood Group -->
                    <div class="col-md-6">

                        <label for="blood_group" class="form-label">
                            Blood Group
                        </label>

                        <select
                            class="form-select"
                            id="blood_group"
                            name="blood_group"
                        >

                            <option value="">
                                Select Blood Group
                            </option>

                            {% for group in
                                ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
                            %}

                            <option
                                value="{{ group }}"
                                {% if patient.BloodGroup == group %}selected{% endif %}
                            >
                                {{ group }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Emergency Contact -->
                    <div class="col-md-6">

                        <label for="emergency_contact" class="form-label">
                            Emergency Contact
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="emergency_contact"
                            name="emergency_contact"
                            value="{{ patient.EmergencyContact or '' }}"
                        >

                    </div>


                    <!-- Address -->
                    <div class="col-12">

                        <label for="address" class="form-label">
                            Address
                        </label>

                        <textarea
                            class="form-control"
                            id="address"
                            name="address"
                            rows="3"
                        >{{ patient.Address or '' }}</textarea>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a
                        href="{{ url_for(
                            'main.patient_details',
                            patient_id=patient.PatientID
                        ) }}"
                        class="btn btn-outline-secondary"
                    >
                        <i class="bi bi-x-circle"></i>
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-dark"
                    >
                        <i class="bi bi-check-circle"></i>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
