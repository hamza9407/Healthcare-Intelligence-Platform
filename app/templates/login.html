
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Healthcare Intelligence Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e8f5f3, #eef3fa);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .login-header {
            background: #126c78;
            color: white;
            border-radius: 18px 18px 0 0;
            padding: 30px 20px;
            text-align: center;
        }

        .btn-login {
            background: #126c78;
            color: white;
        }

        .btn-login:hover {
            background: #0e5660;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card login-card">

        <div class="login-header">
            <h3>Healthcare Intelligence</h3>
            <p class="mb-0">Management Platform</p>
        </div>

        <div class="card-body p-4">

            <h5 class="text-center mb-4">Sign in to your account</h5>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Sign In
                </button>

            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Healthcare Intelligence &amp; Management Platform
            </p>

        </div>
    </div>
</body>
</html>
